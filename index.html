<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google-site-verification" content="DrJElTC7dNRjqw8ECF97ahdwvBaATVkWQLGVbFHgHo8">

<title>Happy Diwali 2026 – Greeting Cards</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  text-align: center;
  color: white;
  background: radial-gradient(circle at top, #5b1600, #160018 70%, #05000a);
  overflow-x: hidden;
}

#fireworks {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 5;
}

.container {
  position: relative;
  z-index: 2;
  width: 92%;
  max-width: 480px;
  margin: 25px auto;
  padding: 22px;
  border: 2px solid #ffd700;
  border-radius: 22px;
  background: rgba(30, 0, 30, 0.94);
  box-shadow: 0 0 25px #ff8c00;
}

h1 {
  color: #ffd700;
  font-size: 32px;
  text-shadow: 0 0 15px orange;
}

.subtitle {
  color: #ffe6a3;
  line-height: 1.6;
}

input, button {
  width: 100%;
  padding: 13px;
  margin-top: 12px;
  border-radius: 10px;
  font-size: 16px;
}

input {
  border: 1px solid #ffd700;
  background: #fff9e8;
  color: #250025;
}

button {
  border: none;
  background: linear-gradient(90deg, #ff9800, #ffd700);
  color: #300018;
  font-weight: bold;
  cursor: pointer;
}

button:active { transform: scale(0.98); }

.card {
  margin-top: 22px;
  padding: 20px 12px;
  border: 3px solid #ffdc55;
  border-radius: 18px;
  background: linear-gradient(145deg, #7c1600, #35004c);
}

.diya { font-size: 48px; }

#greeting {
  font-size: 26px;
  color: #ffe66d;
  overflow-wrap: anywhere;
}

#message {
  line-height: 1.8;
  color: #fff1c1;
}

#preview {
  display: none;
  max-width: 90%;
  max-height: 240px;
  margin: 15px auto;
  border: 3px solid gold;
  border-radius: 12px;
  object-fit: contain;
}

.footer {
  font-size: 12px;
  color: #e8c8e8;
  margin-top: 20px;
}

#status {
  font-size: 14px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

</style>
</head>

<body>

<canvas id="fireworks"></canvas>

<div class="container">

<h1>🪔 Happy Diwali 🪔</h1>

<p class="subtitle">✨ रोशनी, खुशियों और प्यार का त्योहार ✨</p>

<input id="nameInput" type="text" maxlength="50"
placeholder="अपना नाम लिखें">

<input id="photoInput" type="file" accept="image/*">

<img id="preview" alt="आपकी फोटो">

<button onclick="makeGreeting()">🎉 मेरा ग्रीटिंग कार्ड बनाओ</button>

<div class="card" id="greetingCard">
  <div class="diya">🪔</div>
  <h2 id="greeting">शुभ दीपावली! 🪔</h2>
  <p id="message">
    आपके जीवन में सुख, शांति और समृद्धि आए।
    आपकी हर खुशी रोशनी की तरह चमकती रहे।
  </p>
  <img id="cardPhoto" alt="" style="display:none;max-width:90%;max-height:240px;border:3px solid gold;border-radius:12px;margin:10px auto;">
  <div class="diya">🪔 ✨ 🪔</div>
  <p>✨ आपको और आपके परिवार को दीपावली की शुभकामनाएँ ✨</p>
</div>

<button onclick="downloadCard()">⬇️ ग्रीटिंग कार्ड डाउनलोड करें</button>

<button onclick="shareCard()">📸 फोटो के साथ शेयर करें</button>

<button onclick="shareWebsite()">🔗 वेबसाइट का लिंक WhatsApp पर भेजें</button>

<button onclick="shareWhatsAppText()">💬 WhatsApp पर शुभकामना भेजें</button>

<p id="status" role="status" aria-live="polite"></p>

<button onclick="startFireworks()">🎆 आतिशबाजी शुरू करें</button>
<button onclick="stopFireworks()">आतिशबाजी रोकें</button>

<div class="footer">Made with ❤️ for Diwali</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
const WEBSITE_URL = "https://zerotracexhack.github.io/my-website/";

const nameInput = document.getElementById("nameInput");
const photoInput = document.getElementById("photoInput");
const preview = document.getElementById("preview");
const cardPhoto = document.getElementById("cardPhoto");
const statusBox = document.getElementById("status");

function setStatus(text) {
  statusBox.textContent = text;
}

function makeGreeting() {
  const name = nameInput.value.trim();

  document.getElementById("greeting").textContent =
    name ? "शुभ दीपावली, " + name + "! 🪔" : "शुभ दीपावली! 🪔";

  document.getElementById("message").textContent =
    "आपके जीवन में खुशियाँ, सफलता और समृद्धि आए। " +
    "आपका हर दिन दीपावली की रोशनी जैसा चमकता रहे! ✨";

  cardPhoto.src = preview.src;
  cardPhoto.style.display =
    preview.style.display === "none" ? "none" : "block";

  setStatus("आपका ग्रीटिंग कार्ड तैयार है!");
}

photoInput.addEventListener("change", function() {
  const file = this.files[0];
  if (!file) return;

  if (!file.type.startsWith("image/")) {
    setStatus("कृपया सही फोटो चुनें।");
    this.value = "";
    return;
  }

  if (file.size > 8 * 1024 * 1024) {
    setStatus("कृपया 8 MB से छोटी फोटो चुनें।");
    this.value = "";
    return;
  }

  const reader = new FileReader();

  reader.onload = function(event) {
    preview.onload = function() {
      preview.style.display = "block";
      cardPhoto.src = event.target.result;
      cardPhoto.style.display = "block";
      setStatus("फोटो कार्ड में जोड़ दी गई है।");
    };

    preview.src = event.target.result;
  };

  reader.readAsDataURL(file);
});

async function createCardImage() {
  if (typeof html2canvas !== "function") {
    throw new Error("कार्ड बनाने की लाइब्रेरी नहीं खुली। इंटरनेट जाँचें।");
  }

  makeGreeting();

  if (preview.style.display !== "none" && !preview.complete) {
    await new Promise((resolve, reject) => {
      preview.onload = resolve;
      preview.onerror = reject;
    });
  }

  const canvas = await html2canvas(
    document.getElementById("greetingCard"),
    { backgroundColor: null, scale: 2, useCORS: true }
  );

  return new Promise((resolve, reject) => {
    canvas.toBlob(blob => {
      if (blob) resolve(blob);
      else reject(new Error("कार्ड की फोटो नहीं बन पाई।"));
    }, "image/png");
  });
}

async function downloadCard() {
  try {
    setStatus("कार्ड तैयार हो रहा है...");
    const blob = await createCardImage();
    const link = document.createElement("a");
    const objectURL = URL.createObjectURL(blob);

    link.href = objectURL;
    link.download = "Happy-Diwali-Greeting.png";
    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(objectURL), 3000);
    setStatus("डाउनलोड शुरू करने का अनुरोध भेज दिया गया है।");
  } catch (error) {
    setStatus(error.message);
  }
}

async function shareCard() {
  try {
    setStatus("कार्ड की फोटो तैयार हो रही है...");
    const blob = await createCardImage();

    const file = new File(
      [blob],
      "Happy-Diwali-Greeting.png",
      { type: "image/png" }
    );

    if (navigator.canShare && navigator.share &&
        navigator.canShare({ files: [file] })) {

      await navigator.share({
        files: [file],
        title: "Happy Diwali",
        text: "🪔 शुभ दीपावली! मेरी वेबसाइट भी देखें: " + WEBSITE_URL
      });

      setStatus("शेयर मेन्यू खुल गया। WhatsApp चुनें।");

    } else {
      await downloadCard();

      setStatus(
        "फोटो डाउनलोड करें। फिर WhatsApp में फोटो के साथ वेबसाइट का लिंक भेजें।"
      );

      shareWebsite();
    }
  } catch (error) {
    if (error.name === "AbortError") {
      setStatus("शेयर करना रद्द कर दिया गया।");
    } else {
      setStatus(error.message || "फोटो शेयर नहीं हो पाई।");
    }
  }
}

function shareWebsite() {
  const text =
    "🪔 Happy Diwali! ✨\n\n" +
    "अपना ग्रीटिंग कार्ड यहाँ बनाएँ और डाउनलोड करें:\n" +
    WEBSITE_URL;

  window.open(
    "https://wa.me/?text=" + encodeURIComponent(text),
    "_blank"
  );
}

function shareWhatsAppText() {
  const name = nameInput.value.trim() || "आप सभी";

  const text =
    "🪔 शुभ दीपावली, " + name + "! ✨\n" +
    "आपके जीवन में सुख, शांति और समृद्धि आए। 🎆\n\n" +
    "अपना ग्रीटिंग कार्ड यहाँ बनाएँ:\n" +
    WEBSITE_URL;

  window.open(
    "https://wa.me/?text=" + encodeURIComponent(text),
    "_blank"
  );
}

/* लगातार चलने वाली डिजिटल आतिशबाजी */

const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

let particles = [];
let animationId = null;

function resizeCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = Math.floor(window.innerWidth * dpr);
  canvas.height = Math.floor(window.innerHeight * dpr);

  canvas.style.width = window.innerWidth + "px";
  canvas.style.height = window.innerHeight + "px";

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();

function burst(x, y) {
  const colors = [
    "#ffcc00", "#ff3300", "#ff66ff",
    "#00ffff", "#ffffff", "#66ff66"
  ];

  for (let i = 0; i < 65; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 4 + 1;

    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 70 + Math.random() * 30,
      color: colors[Math.floor(Math.random() * colors.length)]
    });
  }
}

function animate() {
  ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

  if (Math.random() < 0.045) {
    burst(
      Math.random() * window.innerWidth,
      Math.random() * window.innerHeight * 0.65
    );
  }

  particles = particles.filter(p => p.life > 0);

  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.025;
    p.vx *= 0.99;
    p.vy *= 0.99;
    p.life--;

    ctx.globalAlpha = Math.max(0, p.life / 100);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.globalAlpha = 1;
  animationId = requestAnimationFrame(animate);
}

function startFireworks() {
  if (animationId === null) animate();
}

function stopFireworks() {
  if (animationId !== null) {
    cancelAnimationFrame(animationId);
    animationId = null;
  }

  particles = [];
  ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
}

startFireworks();
</script>

</body>
</html>
