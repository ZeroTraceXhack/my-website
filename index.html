<!DOCTYPE html>
<html lang="hi">
<head>
  <meta name="google-site-verification" content="DrJElTC7dNRjqw8ECF97ahdwvBaATVkWQLGVbFHgHo8" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨ Happy Diwali ✨</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  text-align: center;
  color: white;
  background: radial-gradient(circle at top, #5b1600, #160018 70%, #05000a);
  overflow-x: hidden;
}

#fireworks {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 5;
}

.container {
  position: relative;
  z-index: 2;
  width: 92%;
  max-width: 480px;
  margin: 25px auto;
  padding: 22px;
  border: 2px solid #ffd700;
  border-radius: 22px;
  background: rgba(30, 0, 30, 0.88);
  box-shadow: 0 0 25px #ff8c00;
}

h1 {
  color: #ffd700;
  font-size: 34px;
  text-shadow: 0 0 15px orange;
}

.subtitle {
  color: #ffe6a3;
  line-height: 1.6;
}

input, button {
  width: 100%;
  padding: 13px;
  margin-top: 12px;
  border-radius: 10px;
  font-size: 16px;
}

input {
  border: 1px solid #ffd700;
  background: #fff9e8;
  color: #250025;
}

button {
  border: none;
  background: linear-gradient(90deg, #ff9800, #ffd700);
  color: #300018;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(0.98);
}

.card {
  margin-top: 22px;
  padding: 20px 12px;
  border: 2px solid #ffdc55;
  border-radius: 18px;
  background: linear-gradient(145deg, #7c1600, #35004c);
}

.diya {
  font-size: 55px;
  animation: glow 1.5s infinite alternate;
}

@keyframes glow {
  from { filter: drop-shadow(0 0 3px orange); }
  to { filter: drop-shadow(0 0 18px gold); }
}

#greeting {
  font-size: 26px;
  color: #ffe66d;
  overflow-wrap: anywhere;
}

#message {
  line-height: 1.8;
  color: #fff1c1;
}

#preview {
  display: none;
  max-width: 100%;
  max-height: 220px;
  margin: 15px auto;
  border: 2px solid gold;
  border-radius: 12px;
}

.footer {
  font-size: 12px;
  color: #e8c8e8;
  margin-top: 20px;
}
</style>
</head>

<body>

<canvas id="fireworks"></canvas>

<div class="container">
  <h1>🪔 Happy Diwali 🪔</h1>

  <p class="subtitle">
    ✨ रोशनी, खुशियों और प्यार का त्योहार ✨
  </p>

  <input id="nameInput" type="text"
         placeholder="अपना नाम लिखें">

  <input id="photoInput" type="file"
         accept="image/*">

  <img id="preview" alt="आपकी फोटो">

  <button onclick="makeGreeting()">
    🎉 मेरा ग्रीटिंग कार्ड बनाओ
  </button>

  <div class="card" id="greetingCard">
    <div class="diya">🪔</div>
    <h2 id="greeting">शुभ दीपावली!</h2>
    <p id="message">
      आपके जीवन में सुख, शांति और समृद्धि आए।
      आपकी हर खुशी रोशनी की तरह चमकती रहे।
    </p>
    <div class="diya">🪔 ✨ 🪔</div>
  </div>

  <button onclick="shareWhatsApp()">
    📲 WhatsApp पर शेयर करें
  </button>

  <button onclick="startFireworks()">
    🎆 आतिशबाजी शुरू करें
  </button>

  <button onclick="stopFireworks()">
    आतिशबाजी रोकें
  </button>

  <div class="footer">
    Made with ❤️ for Diwali
  </div>
</div>
<script>
const nameInput = document.getElementById("nameInput");
const photoInput = document.getElementById("photoInput");
const preview = document.getElementById("preview");

function makeGreeting() {
  const name = nameInput.value.trim();

  document.getElementById("greeting").textContent =
    name ? "शुभ दीपावली, " + name + "! 🪔" : "शुभ दीपावली! 🪔";

  document.getElementById("message").textContent =
    "आपके जीवन में खुशियाँ, सफलता और समृद्धि आए। " +
    "आपका हर दिन दीपावली की रोशनी जैसा चमकता रहे! ✨";
}

photoInput.addEventListener("change", function() {
  const file = this.files[0];

  if (file) {
    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";
  }
});

function shareWhatsApp() {
  const name = nameInput.value.trim() || "आप सभी";
  const text =
    "🪔 शुभ दीपावली, " + name + "! ✨\n" +
    "आपके जीवन में सुख, शांति और समृद्धि आए। 🎆";

  const url =
    "https://wa.me/?text=" + encodeURIComponent(text);

  window.open(url, "_blank");
}

/* डिजिटल आतिशबाजी */
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

let particles = [];
let animationId = null;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();

function burst(x, y) {
  const colors = [
    "#ffcc00", "#ff3300", "#ff66ff",
    "#00ffff", "#ffffff", "#66ff66"
  ];

  for (let i = 0; i < 65; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 4 + 1;

    particles.push({
      x: x,
      y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 70 + Math.random() * 30,
      color: colors[Math.floor(Math.random() * colors.length)]
    });
  }
}

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (Math.random() < 0.045) {
    burst(
      Math.random() * canvas.width,
      Math.random() * canvas.height * 0.65
    );
  }

  particles = particles.filter(p => p.life > 0);

  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.025;
    p.vx *= 0.99;
    p.vy *= 0.99;
    p.life--;

    ctx.globalAlpha = Math.max(0, p.life / 100);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.globalAlpha = 1;
  animationId = requestAnimationFrame(animate);
}

function startFireworks() {
  if (animationId === null) {
    animate();
  }
}

function stopFireworks() {
  if (animationId !== null) {
    cancelAnimationFrame(animationId);
    animationId = null;
  }

  particles = [];
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

startFireworks();
</script>

</body>
</html>
