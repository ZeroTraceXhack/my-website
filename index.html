<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="google-site-verification"
content="DrJElTC7dNRjqw8ECF97ahdwvBaATVkWQLGVbFHgHo8">

<title>Happy Diwali 2026 – Wishes & Greeting Cards</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  text-align: center;
  color: white;
  background: radial-gradient(circle at top, #5b1600, #160018 70%, #05000a);
  overflow-x: hidden;
}

#fireworks {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 5;
}

.container {
  position: relative;
  z-index: 2;
  width: 92%;
  max-width: 480px;
  margin: 25px auto;
  padding: 22px;
  border: 2px solid #ffd700;
  border-radius: 22px;
  background: rgba(30, 0, 30, 0.94);
  box-shadow: 0 0 25px #ff8c00;
}

h1 {
  color: #ffd700;
  font-size: 32px;
  text-shadow: 0 0 15px orange;
}

.subtitle {
  color: #ffe6a3;
  line-height: 1.6;
}

input, button {
  width: 100%;
  padding: 13px;
  margin-top: 12px;
  border-radius: 10px;
  font-size: 16px;
}

input {
  border: 1px solid #ffd700;
  background: #fff9e8;
  color: #250025;
}

button {
  border: none;
  background: linear-gradient(90deg, #ff9800, #ffd700);
  color: #300018;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(0.98);
}

.card {
  margin-top: 22px;
  padding: 20px 12px;
  border: 3px solid #ffdc55;
  border-radius: 18px;
  background: linear-gradient(145deg, #7c1600, #35004c);
  box-shadow: inset 0 0 18px rgba(255,215,0,0.2);
}

.diya {
  font-size: 48px;
}

#greeting {
  font-size: 26px;
  color: #ffe66d;
  overflow-wrap: anywhere;
}

#message {
  line-height: 1.8;
  color: #fff1c1;
  overflow-wrap: anywhere;
}

#preview {
  display: none;
  width: auto;
  max-width: 90%;
  max-height: 240px;
  margin: 15px auto;
  border: 3px solid gold;
  border-radius: 12px;
  object-fit: contain;
}

.footer {
  font-size: 12px;
  color: #e8c8e8;
  margin-top: 20px;
}

.note {
  font-size: 13px;
  color: #ffe6a3;
  line-height: 1.6;
}

#status {
  font-size: 14px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

@media (max-width: 380px) {
  .container {
    padding: 14px;
  }

  h1 {
    font-size: 27px;
  }

  #greeting {
    font-size: 22px;
  }
}
</style>
</head>

<body>

<canvas id="fireworks"></canvas>

<div class="container">

  <h1>🪔 Happy Diwali 🪔</h1>

  <p class="subtitle">
    ✨ रोशनी, खुशियों और प्यार का त्योहार ✨
  </p>

  <input
    id="nameInput"
    type="text"
    maxlength="50"
    placeholder="अपना नाम लिखें"
    autocomplete="name"
  >

  <input
    id="photoInput"
    type="file"
    accept="image/jpeg,image/png,image/webp"
  >

  <p class="note">
    अपनी फोटो चुनें और अपना ग्रीटिंग कार्ड बनाएँ।
  </p>

  <button onclick="makeGreeting()">
    🎉 मेरा ग्रीटिंग कार्ड बनाओ
  </button>

  <div class="card" id="greetingCard">

    <div class="diya">🪔</div>

    <h2 id="greeting">शुभ दीपावली! 🪔</h2>

    <p id="message">
      आपके जीवन में सुख, शांति और समृद्धि आए।
      आपकी हर खुशी रोशनी की तरह चमकती रहे।
    </p>

    <img id="preview" alt="ग्रीटिंग कार्ड की फोटो">

    <div class="diya">🪔 ✨ 🪔</div>

    <p style="color:#ffe6a3;font-size:13px;">
      ✨ आपके और आपके परिवार को दीपावली की शुभकामनाएँ ✨
    </p>

  </div>

  <button id="downloadBtn" onclick="downloadCard()">
    ⬇️ ग्रीटिंग कार्ड डाउनलोड करें
  </button>

  <button onclick="shareCard()">
    📲 फोटो के साथ WhatsApp पर शेयर करें
  </button>

  <button onclick="shareWhatsAppText()">
    💬 WhatsApp पर संदेश शेयर करें
  </button>

  <p id="status" role="status" aria-live="polite"></p>

  <button onclick="startFireworks()">
    🎆 आतिशबाजी शुरू करें
  </button>

  <button onclick="stopFireworks()">
    आतिशबाजी रोकें
  </button>

  <div class="footer">
    Made with ❤️ for Diwali
  </div>

</div>

<!-- कार्ड की फोटो बनाने के लिए html2canvas -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
const nameInput = document.getElementById("nameInput");
const photoInput = document.getElementById("photoInput");
const preview = document.getElementById("preview");
const statusBox = document.getElementById("status");

let photoReady = Promise.resolve();

function setStatus(message) {
  statusBox.textContent = message;
}

function makeGreeting() {
  const name = nameInput.value.trim();

  document.getElementById("greeting").textContent =
    name ? "शुभ दीपावली, " + name + "! 🪔" : "शुभ दीपावली! 🪔";

  document.getElementById("message").textContent =
    "आपके जीवन में खुशियाँ, सफलता और समृद्धि आए। " +
    "आपका हर दिन दीपावली की रोशनी जैसा चमकता रहे! ✨";

  setStatus("आपका ग्रीटिंग कार्ड तैयार है!");
}

photoInput.addEventListener("change", function() {
  const file = this.files[0];

  if (!file) {
    preview.removeAttribute("src");
    preview.style.display = "none";
    photoReady = Promise.resolve();
    return;
  }

  if (!file.type.startsWith("image/")) {
    setStatus("कृपया सही फोटो चुनें।");
    this.value = "";
    return;
  }

  if (file.size > 8 * 1024 * 1024) {
    setStatus("फोटो 8 MB से छोटी चुनें।");
    this.value = "";
    return;
  }

  photoReady = new Promise((resolve, reject) => {
    const reader = new FileReader();

    reader.onload = function(event) {
      preview.onload = function() {
        preview.style.display = "block";
        setStatus("फोटो कार्ड में जोड़ दी गई है।");
        resolve();
      };

      preview.onerror = function() {
        preview.style.display = "none";
        reject(new Error("फोटो नहीं खुल सकी।"));
      };

      preview.src = event.target.result;
    };

    reader.onerror = function() {
      reject(new Error("फोटो पढ़ी नहीं जा सकी।"));
    };

    reader.readAsDataURL(file);
  });
});

async function createCardImage() {
  if (typeof html2canvas !== "function") {
    throw new Error(
      "कार्ड बनाने की लाइब्रेरी लोड नहीं हुई। इंटरनेट कनेक्शन जाँचें।"
    );
  }

  await photoReady;

  if (document.fonts && document.fonts.ready) {
    await document.fonts.ready;
  }

  if (preview.style.display !== "none" && !preview.complete) {
    await new Promise((resolve, reject) => {
      preview.onload = resolve;
      preview.onerror = reject;
    });
  }

  const card = document.getElementById("greetingCard");

  const canvas = await html2canvas(card, {
    backgroundColor: null,
    scale: 2,
    useCORS: true,
    logging: false
  });

  return new Promise((resolve, reject) => {
    canvas.toBlob(function(blob) {
      if (blob) {
        resolve(blob);
      } else {
        reject(new Error("कार्ड की फोटो नहीं बन पाई।"));
      }
    }, "image/png");
  });
}

async function downloadCard() {
  const button = document.getElementById("downloadBtn");

  button.disabled = true;
  setStatus("कार्ड तैयार किया जा रहा है...");

  try {
    const blob = await createCardImage();
    const imageURL = URL.createObjectURL(blob);

    const link = document.createElement("a");
    link.href = imageURL;
    link.download = "Happy-Diwali-Greeting.png";

    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(imageURL), 2000);

    setStatus(
      "कार्ड डाउनलोड करने का अनुरोध भेज दिया गया है। " +
      "अगर डाउनलोड न दिखे, तो ब्राउज़र के Downloads फोल्डर में देखें।"
    );
  } catch (error) {
    setStatus(error.message || "कार्ड डाउनलोड नहीं हो पाया।");
  } finally {
    button.disabled = false;
  }
}

async function shareCard() {
  setStatus("फोटो तैयार की जा रही है...");

  try {
    const blob = await createCardImage();
    const file = new File(
      [blob],
      "Happy-Diwali-Greeting.png",
      { type: "image/png" }
    );

    if (
      navigator.share &&
      navigator.canShare &&
      navigator.canShare({ files: [file] })
    ) {
      await navigator.share({
        files: [file],
        title: "Happy Diwali",
        text: "🪔 शुभ दीपावली! ✨"
      });

      setStatus("शेयर मेन्यू खुल गया। WhatsApp चुनकर फोटो भेजें।");
    } else {
      const imageURL = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = imageURL;
      link.download = "Happy-Diwali-Greeting.png";

      document.body.appendChild(link);
      link.click();
      link.remove();

      setTimeout(() => URL.revokeObjectURL(imageURL), 2000);

      setStatus(
        "इस ब्राउज़र में फोटो सीधे शेयर करना उपलब्ध नहीं है। " +
        "फोटो डाउनलोड करें, फिर WhatsApp में अटैचमेंट से भेजें।"
      );

      window.open(
        "https://wa.me/?text=" +
        encodeURIComponent("🪔 शुभ दीपावली! ✨ " +
        "https://zerotracexhack.github.io/my-website/"),
        "_blank"
      );
    }
  } catch (error) {
    if (error.name === "AbortError") {
      setStatus("शेयर करना रद्द कर दिया गया।");
    } else {
      setStatus(error.message || "फोटो शेयर नहीं हो पाई।");
    }
  }
}

function shareWhatsAppText() {
  const name = nameInput.value.trim() || "आप सभी";

  const text =
    "🪔 शुभ दीपावली, " + name + "! ✨\n" +
    "आपके जीवन में सुख, शांति और समृद्धि आए। 🎆\n\n" +
    "मेरा ग्रीटिंग कार्ड यहाँ देखें:\n" +
    "https://zerotracexhack.github.io/my-website/";

  window.open(
    "https://wa.me/?text=" + encodeURIComponent(text),
    "_blank"
  );
}

/* डिजिटल आतिशबाजी — पहले की तरह लगातार चलती रहेगी */

const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

let particles = [];
let animationId = null;

function resizeCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = Math.floor(window.innerWidth * dpr);
  canvas.height = Math.floor(window.innerHeight * dpr);

  canvas.style.width = window.innerWidth + "px";
  canvas.style.height = window.innerHeight + "px";

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();

function burst(x, y) {
  const colors = [
    "#ffcc00", "#ff3300", "#ff66ff",
    "#00ffff", "#ffffff", "#66ff66"
  ];

  for (let i = 0; i < 65; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 4 + 1;

    particles.push({
      x: x,
      y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 70 + Math.random() * 30,
      color: colors[Math.floor(Math.random() * colors.length)]
    });
  }
}

function animate() {
  ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

  if (Math.random() < 0.045) {
    burst(
      Math.random() * window.innerWidth,
      Math.random() * window.innerHeight * 0.65
    );
  }

  particles = particles.filter(p => p.life > 0);

  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.025;
    p.vx *= 0.99;
    p.vy *= 0.99;
    p.life--;

    ctx.globalAlpha = Math.max(0, p.life / 100);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.globalAlpha = 1;
  animationId = requestAnimationFrame(animate);
}

function startFireworks() {
  if (animationId === null) {
    animate();
  }
}

function stopFireworks() {
  if (animationId !== null) {
    cancelAnimationFrame(animationId);
    animationId = null;
  }

  particles = [];
  ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
}

startFireworks();
</script>

</body>
</html>
